# Where every service lives, resolved from the inventory so IPs are defined once.
postgres_host: "{{ hostvars[groups['db'][0]].ansible_host }}"
redis_host: "{{ hostvars[groups['cache'][0]].ansible_host }}"

app_port: 8080
postgres_port: 5432
redis_port: 6379

postgres_db: url_shortener
postgres_user: estrela
# Read from the controller's environment (e.g. `set -a; source ../.env`) so the
# password never lands in git. Falls back to a dev default.
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('postgres', true) }}"

# OTLP/HTTP endpoint of the monitoring stack (Jaeger), e.g. http://192.168.0.240:4318.
# Leave empty to keep the OpenTelemetry agent disabled on the app instances.
otel_endpoint: "{{ lookup('env', 'OTEL_EXPORTER_OTLP_ENDPOINT') }}"

# Prometheus exporter ports, one per VM role.
node_exporter_port: 9100
nginx_exporter_port: 9113
redis_exporter_port: 9121
postgres_exporter_port: 9187
