- name: Project directory
  file:
    path: /opt/postgres
    state: directory
    mode: "0750"

# Contains the DB password, so keep it root-only.
- name: Compose file
  template:
    src: compose.yml.j2
    dest: /opt/postgres/compose.yml
    mode: "0600"

- name: Run postgres + postgres-exporter
  community.docker.docker_compose_v2:
    project_src: /opt/postgres
    remove_orphans: true
    wait: true
