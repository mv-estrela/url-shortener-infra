- name: Project directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/opt/nginx, /opt/nginx/conf]

- name: Compose file
  template:
    src: compose.yml.j2
    dest: /opt/nginx/compose.yml
    mode: "0644"

- name: nginx config
  template:
    src: nginx.conf.j2
    dest: /opt/nginx/conf/nginx.conf
    mode: "0644"
  notify: Reload nginx

- name: Run nginx + nginx-exporter
  community.docker.docker_compose_v2:
    project_src: /opt/nginx
    remove_orphans: true
    wait: true
